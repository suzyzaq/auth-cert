apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-inspection-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-inspection-web
  template:
    metadata:
      labels:
        app: auth-inspection-web
    spec:
      containers:
        - name: web
          image: ${ACR_REGISTRY}/auth-inspection-web:${IMAGE_TAG}
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }

