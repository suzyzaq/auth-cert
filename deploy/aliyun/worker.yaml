apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-inspection-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-inspection-worker
  template:
    metadata:
      labels:
        app: auth-inspection-worker
    spec:
      containers:
        - name: worker
          image: ${ACR_REGISTRY}/auth-inspection-worker:${IMAGE_TAG}
          envFrom:
            - secretRef:
                name: auth-inspection-runtime
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }

