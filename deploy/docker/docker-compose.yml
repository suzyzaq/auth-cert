services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_inspection
      POSTGRES_PASSWORD: auth_inspection
      POSTGRES_DB: auth_inspection
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_inspection"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - auth-inspection-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  auth-inspection-postgres:
