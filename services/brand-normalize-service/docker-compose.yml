services:
  brand-normalize:
    build: .
    image: ofs-brand-normalize:1.1.0
    container_name: ofs-brand-normalize
    restart: unless-stopped
    ports:
      - "${BRAND_HOST_PORT:-8000}:8000"
    environment:
      # 业务鉴权 Token（请改为强随机值；也可放 .env 文件）
      BRAND_API_TOKEN: ${BRAND_API_TOKEN:-change-me-to-a-strong-token}
      # 品牌库路径（容器内固定）
      BRAND_DATA_PATH: /data/matcher.db
      SCS_ENABLED: "1"
      SCS_TOKEN_FILE: /secrets/scs-token.json
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      # 只读挂载品牌主库（DPATH 在 .env 中指定）
      - ${BRAND_DB_PATH}:/data/matcher.db:ro
      # 只读挂载 SCS 凭据目录（每周刷新脚本更新宿主机文件即可）
      - ${SCS_SECRET_DIR}:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
